[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-kit"
version = "0.1.1"
description = "Small, dependency-free LLM call helpers: Ollama, any OpenAI-compatible endpoint, JSON reply parsing, free-model guard."
requires-python = ">=3.10"
license = "MIT"

[tool.setuptools]
packages = ["llm_kit"]
